name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.20
        with:
          configurationFile: renovate.json
          token: '${{ secrets.RENOVATE_TOKEN }}'
